# docker-compose.yml

# =============================================================
#  Peak Load Detection System — Group 25
#  CO326: Computer Systems Engineering — Industrial Networks
#
#  Four-Container Architecture:
#    Container 1: Eclipse Mosquitto (MQTT Broker)
#    Container 2: Node-RED Dashboard  (real-time visualization)
#    Container 3: InfluxDB 2.x        (time-series storage)
#    Container 4: Grafana             (historical dashboards)
#
#  The Python Edge AI runs on the HOST (not in Docker) because
#  it needs serial USB access to the ESP32.
#
#  Run:  docker compose up
#  Then: python python/mqtt_publisher.py   (on host)
# =============================================================

services:

  # ─────────────────────────────────────────────────────────
  #  Container 1: Eclipse Mosquitto MQTT Broker
  #  Central message bus — all data flows through here.
  #  Exposed on port 1883 so the host Python script can connect.
  # ─────────────────────────────────────────────────────────
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: group25-mqtt-broker
    ports:
      - "1884:1883"       # External 1884 → internal 1883 (avoid local Mosquitto conflict)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t \"health/check\" -m \"ping\" >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - peak_net

  # ─────────────────────────────────────────────────────────
  #  Container 2: Node-RED Dashboard
  #  Real-time visualization: gauge, chart, fan animation,
  #  alert panel, and manual relay controls.
  #  Dashboard: http://localhost:1880/ui
  # ─────────────────────────────────────────────────────────
  node-red:
    image: nodered/node-red:latest
    container_name: group25-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red:/data
    environment:
      TZ: "Asia/Colombo"
    depends_on:
      - mqtt-broker
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - peak_net

  # ─────────────────────────────────────────────────────────
  #  Container 3: InfluxDB 2.x (Time-Series Database)
  #  Stores all sensor readings and peak detection events
  #  for historical analysis via Grafana dashboards.
  #  Admin UI: http://localhost:8086
  # ─────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2
    container_name: group25-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: group25
      DOCKER_INFLUXDB_INIT_BUCKET: peak_load
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: peak-token-group25
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - peak_net

  # ─────────────────────────────────────────────────────────
  #  Container 4: Grafana (Historical Dashboard)
  #  Connects to InfluxDB for time-series visualization.
  #  Pre-provisioned with datasource and dashboard.
  #  Dashboard: http://localhost:3000  (admin/admin)
  # ─────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: group25-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/peak_load_dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - peak_net

# ─────────────────────────────────────────────────────────────
#  Docker volumes for persistent data
# ─────────────────────────────────────────────────────────────
volumes:
  influxdb_data:
  grafana_data:

# ─────────────────────────────────────────────────────────────
#  Internal docker network
# ─────────────────────────────────────────────────────────────
networks:
  peak_net:
    driver: bridge
